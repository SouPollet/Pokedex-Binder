<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Binder">
<meta name="theme-color" content="#1b2b21">
<title>Pokédex Binder — Gen I &amp; II</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --binder-1: #1b2b21;
    --binder-2: #12201a;
    --page: #f6f0e2;
    --page-edge: #e7dcc2;
    --ink: #23301f;
    --ink-soft: #6b6656;
    --gold: #c9a24b;
    --gold-soft: #e3c785;
    --slot-empty-bg: #ece4d0;
    --slot-empty-line: #cabf9d;
    --danger: #b5493f;

    --t-normal:#9a9a71; --t-fire:#e2762f; --t-water:#5e87e0; --t-electric:#e8bf2a;
    --t-grass:#6cb04a; --t-ice:#82c9c6; --t-fighting:#b7392f; --t-poison:#95379a;
    --t-ground:#cc9f4f; --t-flying:#93a6e6; --t-psychic:#e8548a; --t-bug:#98a422;
    --t-rock:#a6923a; --t-ghost:#5f4f79; --t-dragon:#6650e6; --t-dark:#5f4c3d;
    --t-steel:#9a9ab0; --t-fairy:#d17aa8;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% -10%, #24382c 0%, var(--binder-1) 45%, var(--binder-2) 100%);
    min-height:100vh;
    overscroll-behavior:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 84px);
    position:relative;
  }

  /* ---------- Header ---------- */
  .titlebar{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .titlebar h1{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:26px;
    line-height:1.05;
    color:#f4efe0;
    margin:0;
  }
  .titlebar p{margin:4px 0 0; font-size:13px; color:#b9c2b3;}
  .ring-wrap{position:relative; width:54px; height:54px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:rgba(255,255,255,0.12); stroke-width:5;}
  .ring-fg{fill:none; stroke:var(--gold); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
  .ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:11px; color:#f4efe0;}

  .progress-line{display:flex; align-items:center; gap:8px; margin-top:14px;}
  .bar{flex:1; height:6px; border-radius:6px; background:rgba(255,255,255,0.1); overflow:hidden;}
  .bar>span{display:block; height:100%; background:linear-gradient(90deg, var(--gold-soft), var(--gold)); border-radius:6px; transition:width .5s ease;}
  .progress-line small{font-family:'Space Mono',monospace; font-size:11px; color:#cdd4c6; white-space:nowrap;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:6px; margin-top:16px;
    background:rgba(255,255,255,0.06);
    padding:4px; border-radius:12px;
  }
  .tabs button{
    flex:1; border:0; padding:9px 6px; border-radius:9px;
    background:transparent; color:#cfd6c8;
    font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px;
    cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .tabs button.active{background:var(--page); color:var(--ink); box-shadow:0 2px 6px rgba(0,0,0,0.25);}
  .tabs button span{display:block; font-family:'Space Mono',monospace; font-size:10px; margin-top:2px; opacity:.7;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex; gap:8px; margin-top:12px;}
  .search{
    flex:1; display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.08); border-radius:11px; padding:9px 12px;
  }
  .search input{
    border:0; background:transparent; outline:0; width:100%;
    color:#f4efe0; font-family:'Inter',sans-serif; font-size:14px;
  }
  .search input::placeholder{color:#8d9587;}
  .search svg{flex-shrink:0; opacity:.7;}
  .filter-btn{
    width:38px; flex-shrink:0; border:0; border-radius:11px;
    background:rgba(255,255,255,0.08); color:#cfd6c8; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  .filter-btn.active{background:var(--gold); color:#2a2110;}

  /* ---------- Page (binder sheet) ---------- */
  .sheet{
    margin-top:16px;
    background:var(--page);
    border-radius:18px;
    padding:14px 12px 10px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 18px 30px -14px rgba(0,0,0,0.55),
      0 0 0 1px rgba(0,0,0,0.06);
    position:relative;
  }
  .sheet::before{ /* ring binder holes */
    content:"";
    position:absolute; left:-6px; top:18px; bottom:18px; width:12px;
    background-image: radial-gradient(circle, var(--binder-2) 3.5px, transparent 3.6px);
    background-size:12px 34px;
    background-repeat:repeat-y;
    opacity:.9;
  }
  .sheet-head{display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 10px; border-bottom:1px dashed var(--page-edge);}
  .sheet-head h2{margin:0; font-family:'Fredoka',sans-serif; font-size:14px; font-weight:600; color:var(--ink);}
  .sheet-head span{font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft);}

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:9px;
    padding-top:10px;
    animation:pageIn .28s ease;
  }
  @keyframes pageIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .grid{animation:none;}
  }

  .slot{
    position:relative;
    aspect-ratio:5/7;
    border:0; padding:0; cursor:pointer;
    border-radius:12px;
    background:#fff;
    font-family:inherit;
    text-align:left;
    overflow:hidden;
    transition:transform .12s ease;
  }
  .slot:active{transform:scale(0.95);}
  .slot.pop{animation:pop .32s ease;}
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);} }

  .slot.blank{visibility:hidden; pointer-events:none;}

  .slot.is-empty{
    background:var(--slot-empty-bg);
    border:1.5px dashed var(--slot-empty-line);
  }
  .slot.is-empty .art{filter:grayscale(1) brightness(1.25); opacity:.35;}
  .slot.is-empty .name, .slot.is-empty .types{display:none;}
  .slot.is-empty .plus{
    position:absolute; right:6px; bottom:6px;
    width:20px; height:20px; border-radius:50%;
    background:rgba(35,48,31,0.75); color:#f6f0e2;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1;
  }

  .slot.is-caught{
    background:linear-gradient(160deg, #ffffff 0%, #fbf6ea 60%, #f3e6c4 100%);
    box-shadow:0 4px 10px -4px rgba(0,0,0,0.35), 0 0 0 1.5px var(--gold-soft) inset;
  }
  .slot.is-caught::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 30%);
    pointer-events:none;
  }

  .dex-no{
    position:absolute; top:5px; left:6px;
    font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.02em;
    color:var(--ink-soft); z-index:2;
  }
  .art{
    width:100%; height:62%;
    display:flex; align-items:center; justify-content:center;
    padding-top:6px;
  }
  .art img{width:82%; height:82%; object-fit:contain; image-rendering:-webkit-optimize-contrast;}
  .name{
    font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px;
    color:var(--ink); text-align:center; padding:0 4px; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .types{display:flex; justify-content:center; gap:3px; padding:4px 3px 6px; flex-wrap:wrap;}
  .type-pill{
    font-size:7.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:#fff; padding:2px 5px; border-radius:20px; line-height:1.3;
  }
  .caught-badge{
    position:absolute; top:4px; right:4px; width:17px; height:17px; border-radius:50%;
    background:var(--gold); color:#2a2110; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; z-index:2;
    box-shadow:0 1px 2px rgba(0,0,0,0.3);
  }

  /* ---------- Empty search state ---------- */
  .empty-state{
    grid-column:1/-1; padding:36px 10px; text-align:center; color:var(--ink-soft);
  }
  .empty-state strong{display:block; color:var(--ink); font-family:'Fredoka',sans-serif; font-size:15px; margin-bottom:4px;}

  /* ---------- Bottom nav ---------- */
  .navbar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
    pointer-events:none;
  }
  .navbar-inner{
    pointer-events:auto;
    width:100%; max-width:480px;
    margin:0 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(22,32,26,0.78);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:9px 10px;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.6);
    margin-bottom:10px;
  }
  .nav-btn{
    width:40px; height:40px; border-radius:12px; border:0;
    background:rgba(255,255,255,0.08); color:#f4efe0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .nav-btn:disabled{opacity:.3;}
  .nav-mid{text-align:center; font-family:'Space Mono',monospace; font-size:12px; color:#e9e4d3;}
  .nav-mid b{color:#fff; font-size:13px;}
  .reset-btn{
    width:40px; height:40px; border-radius:12px; border:0;
    background:rgba(181,73,63,0.18); color:#e79892; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Confirm sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,14,10,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; padding:16px;
  }
  .overlay.hidden{display:none;}
  .confirm{
    width:100%; max-width:420px; background:var(--page);
    border-radius:18px; padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .confirm h3{margin:0 0 6px; font-family:'Fredoka',sans-serif; font-size:17px;}
  .confirm p{margin:0 0 16px; font-size:13.5px; color:var(--ink-soft); line-height:1.4;}
  .confirm-row{display:flex; gap:10px;}
  .confirm-row button{
    flex:1; padding:12px; border-radius:12px; border:0; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-cancel{background:rgba(35,48,31,0.08); color:var(--ink);}
  .btn-danger{background:var(--danger); color:#fff;}
</style>
</head>
<body>
<div id="app">

  <div class="titlebar">
    <div>
      <h1>Pokédex Binder</h1>
      <p id="subtitle">Loading your collection…</p>
    </div>
    <div class="ring-wrap">
      <svg width="54" height="54" viewBox="0 0 54 54">
        <circle class="ring-bg" cx="27" cy="27" r="22"></circle>
        <circle id="ring-fg" class="ring-fg" cx="27" cy="27" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"></circle>
      </svg>
      <div class="ring-label" id="ring-label">0%</div>
    </div>
  </div>

  <div class="progress-line">
    <div class="bar"><span id="bar-fill" style="width:0%"></span></div>
    <small id="bar-label">0 / 251</small>
  </div>

  <div class="tabs" id="tabs">
    <button data-gen="1">Gen I<span id="count-gen1">0/151</span></button>
    <button data-gen="2">Gen II<span id="count-gen2">0/100</span></button>
    <button data-gen="all">All<span id="count-all">0/251</span></button>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search name or number" autocomplete="off">
    </div>
    <button class="filter-btn" id="missing-toggle" title="Show missing only">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    </button>
  </div>

  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title">Gen I</h2>
      <span id="sheet-range">#001–#009</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="navbar">
  <div class="navbar-inner">
    <button class="nav-btn" id="prev-btn" aria-label="Previous page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="nav-mid"><b id="page-num">1</b> / <span id="page-total">17</span></div>
    <button class="nav-btn" id="next-btn" aria-label="Next page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="reset-btn" id="reset-btn" aria-label="Reset collection">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="confirm">
    <h3>Empty the binder?</h3>
    <p>This clears every card you've ticked off. Your Pokédex numbers stay — you'll just be starting the collection over.</p>
    <div class="confirm-row">
      <button class="btn-cancel" id="cancel-reset">Cancel</button>
      <button class="btn-danger" id="confirm-reset">Empty it</button>
    </div>
  </div>
</div>

    {id:251,n:"Celebi",t:["psychic","grass"]}
  ];

  const PAGE_SIZE = 9;
  const CIRC = 2 * Math.PI * 22;

  let collected = new Set();
  let gen = "1";
  let query = "";
  let missingOnly = false;
  let page = 0;
  let storageReady = false;

  const el = (id) => document.getElementById(id);
  const grid = el("grid");

  function spriteUrl(id){
    return "sprites/" + String(id).padStart(3,"0") + ".png";
  }
  function fallbackUrl(id){
    return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + id + ".png";
  }
  function pad(id){ return "#" + String(id).padStart(3,"0"); }

  function genRange(g){
    if(g==="1") return [1,151];
    if(g==="2") return [152,251];
    return [1,251];
  }

  function filteredList(){
    const [lo,hi] = genRange(gen);
    const q = query.trim().toLowerCase();
    return POKEMON.filter(p=>{
      if(p.id<lo || p.id>hi) return false;
      if(missingOnly && collected.has(p.id)) return false;
      if(q){
        const numMatch = String(p.id).padStart(3,"0").includes(q) || String(p.id)===q;
        const nameMatch = p.n.toLowerCase().includes(q);
        if(!numMatch && !nameMatch) return false;
      }
      return true;
    });
  }

  function countIn(lo,hi){
    let c=0;
    for(const id of collected) if(id>=lo && id<=hi) c++;
    return c;
  }

  function updateHeader(){
    const total = collected.size;
    const pct = Math.round((total/251)*100);
    el("subtitle").textContent = total===0
      ? "Start ticking off cards as you pull them"
      : total===251
        ? "Complete! Every card is in the binder."
        : total + " of 251 collected · " + (251-total) + " left";
    el("bar-fill").style.width = pct + "%";
    el("bar-label").textContent = total + " / 251";
    el("ring-label").textContent = pct + "%";
    const offset = CIRC - (pct/100)*CIRC;
    el("ring-fg").style.strokeDasharray = CIRC.toFixed(1);
    el("ring-fg").style.strokeDashoffset = offset.toFixed(1);

    el("count-gen1").textContent = countIn(1,151) + "/151";
    el("count-gen2").textContent = countIn(152,251) + "/100";
    el("count-all").textContent = total + "/251";
  }

  function updateTabs(){
    document.querySelectorAll("#tabs button").forEach(b=>{
      b.classList.toggle("active", b.dataset.gen===gen);
    });
    el("sheet-title").textContent = gen==="1" ? "Gen I · Kanto" : gen==="2" ? "Gen II · Johto" : "Gen I & II";
  }

  function render(){
    const list = filteredList();
    const totalPages = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
    if(page >= totalPages) page = totalPages-1;
    if(page < 0) page = 0;

    const start = page*PAGE_SIZE;
    const pageItems = list.slice(start, start+PAGE_SIZE);

    grid.innerHTML = "";

    if(list.length===0){
      const div = document.createElement("div");
      div.className = "empty-state";
      div.innerHTML = "<strong>No cards match</strong>Try a different name, number, or filter.";
      grid.appendChild(div);
    } else {
      for(let i=0;i<PAGE_SIZE;i++){
        const p = pageItems[i];
        if(!p){
          const blank = document.createElement("div");
          blank.className = "slot blank";
          grid.appendChild(blank);
          continue;
        }
        const isCaught = collected.has(p.id);
        const btn = document.createElement("button");
        btn.className = "slot " + (isCaught ? "is-caught" : "is-empty");
        btn.dataset.id = p.id;
        btn.setAttribute("aria-pressed", isCaught ? "true":"false");
        btn.setAttribute("aria-label", p.n + (isCaught? " collected, tap to remove" : " missing, tap to mark collected"));

        const typePills = p.t.map(t=>'<span class="type-pill" style="background:var(--t-'+t+')">'+t+'</span>').join("");

        btn.innerHTML =
          '<span class="dex-no">'+pad(p.id)+'</span>' +
          (isCaught ? '<span class="caught-badge">✓</span>' : '<span class="plus">+</span>') +
          '<div class="art"><img src="'+spriteUrl(p.id)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+fallbackUrl(p.id)+'\'"></div>' +
          '<div class="name">'+p.n+'</div>' +
          '<div class="types">'+typePills+'</div>';

        btn.addEventListener("click", ()=> toggle(p.id, btn));
        grid.appendChild(btn);
      }
    }

    el("page-num").textContent = list.length===0 ? 0 : page+1;
    el("page-total").textContent = totalPages;
    el("prev-btn").disabled = page<=0;
    el("next-btn").disabled = page>=totalPages-1 || list.length===0;

    const [lo] = genRange(gen);
    const rangeStart = lo + page*PAGE_SIZE;
    const rangeEnd = Math.min(rangeStart+PAGE_SIZE-1, lo + (gen==="all"?250:(gen==="1"?150:99)));
    el("sheet-range").textContent = list.length ? (pad(pageItems[0].id) + "–" + pad(pageItems[pageItems.length-1].id)) : "—";

    updateHeader();
  }

  async function toggle(id, btnEl){
    if(collected.has(id)) collected.delete(id); else collected.add(id);
    btnEl.classList.remove("pop");
    void btnEl.offsetWidth;
    btnEl.classList.add("pop");
    render();
    await save();
  }

  const STORAGE_KEY = "pokedex-binder-collected";

  async function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(collected)));
    }catch(e){ console.error("Storage save failed", e); }
  }

  async function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        collected = new Set(JSON.parse(raw));
      }
    }catch(e){
      // no data yet, start fresh
    }
    storageReady = true;
    render();
  }

  // ---- events ----
  document.querySelectorAll("#tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      gen = b.dataset.gen; page = 0; updateTabs(); render();
    });
  });

  let searchTimer;
  el("search").addEventListener("input", (e)=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      query = e.target.value; page = 0; render();
    }, 120);
  });

  el("missing-toggle").addEventListener("click", ()=>{
    missingOnly = !missingOnly;
    el("missing-toggle").classList.toggle("active", missingOnly);
    page = 0; render();
  });

  el("prev-btn").addEventListener("click", ()=>{ page--; render(); });
  el("next-btn").addEventListener("click", ()=>{ page++; render(); });

  el("reset-btn").addEventListener("click", ()=> el("overlay").classList.remove("hidden"));
  el("cancel-reset").addEventListener("click", ()=> el("overlay").classList.add("hidden"));
  el("confirm-reset").addEventListener("click", async ()=>{
    collected = new Set();
    el("overlay").classList.add("hidden");
    render();
    await save();
  });
  el("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") el("overlay").classList.add("hidden"); });

  updateTabs();
  load();
})();
</script>
