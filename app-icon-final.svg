<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background gradient (dark green) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4A34"/>
      <stop offset="100%" stop-color="#0B2018"/>
    </linearGradient>

    <!-- Rounded square mask for iOS/Android style icon -->
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <!-- Orb top gradient (green, 3D sphere shading) -->
    <radialGradient id="orbTop" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8FE0A8"/>
      <stop offset="55%" stop-color="#3FAE63"/>
      <stop offset="100%" stop-color="#1F7B3D"/>
    </radialGradient>

    <!-- Orb bottom gradient (white, 3D sphere shading) -->
    <radialGradient id="orbBottom" cx="45%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F0F5"/>
      <stop offset="100%" stop-color="#D3D1DC"/>
    </radialGradient>

    <!-- Center hinge button gradient -->
    <radialGradient id="hingeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E7E4F5"/>
      <stop offset="100%" stop-color="#B8B3D6"/>
    </radialGradient>

    <!-- Soft drop shadow for depth -->
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Glossy highlight gradient -->
    <radialGradient id="glossGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Subtle background rings -->
    <circle cx="256" cy="256" r="230" fill="none" stroke="#2E5E45" stroke-width="2" opacity="0.4"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#2E5E45" stroke-width="2" opacity="0.3"/>

    <!-- Binder rings (left edge, like a binder spine) -->
    <g opacity="0.9">
      <rect x="34" y="150" width="20" height="46" rx="10" fill="#356B4E"/>
      <rect x="34" y="233" width="20" height="46" rx="10" fill="#356B4E"/>
      <rect x="34" y="316" width="20" height="46" rx="10" fill="#356B4E"/>
    </g>

    <!-- 3D Orb (main icon element, kept centered) -->
    <g filter="url(#softShadow)">
      <!-- Bottom half (white) -->
      <path d="M 146 256 A 110 110 0 0 0 366 256 Z" fill="url(#orbBottom)"/>
      <!-- Top half (green) -->
      <path d="M 146 256 A 110 110 0 0 1 366 256 Z" fill="url(#orbTop)"/>

      <!-- Dividing band -->
      <rect x="146" y="248" width="220" height="16" fill="#12111F"/>

      <!-- Center hinge / button -->
      <circle cx="256" cy="256" r="34" fill="#12111F"/>
      <circle cx="256" cy="256" r="24" fill="url(#hingeGrad)"/>
      <circle cx="256" cy="256" r="24" fill="none" stroke="#8A85B5" stroke-width="3"/>

      <!-- Glossy highlight on upper-left of orb -->
      <ellipse cx="205" cy="200" rx="42" ry="26" fill="url(#glossGrad)"/>
    </g>

    <!-- Card/page (dex) accent, enlarged proportions, tucked behind bottom-right of orb -->
    <g opacity="0.97">
      <rect x="352" y="378" width="150" height="108" rx="16" fill="#F4F2FF" opacity="0.12"/>
      <rect x="332" y="358" width="150" height="108" rx="16" fill="#F4F2FF" opacity="0.22"/>
      <rect x="312" y="338" width="150" height="108" rx="16" fill="#FDFCFF"/>
      <rect x="332" y="358" width="112" height="13" rx="6.5" fill="#B7DEC4"/>
      <rect x="332" y="382" width="86" height="13" rx="6.5" fill="#DAD5F0"/>
      <rect x="332" y="406" width="98" height="13" rx="6.5" fill="#DAD5F0"/>
    </g>
  </g>
</svg>
